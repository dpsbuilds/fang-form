services:
  db:
    build:
      context: ./src/db
      dockerfile: Dockerfile
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U -d fangform"]
      interval: 1s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/18/docker

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  api:
    build:
      context: ./src/api
      dockerfile: Dockerfile
    ports:
      - "5223:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"

  web:
    build:
      context: ./src/web
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    depends_on:
      - api
    develop:
      watch:
        - action: sync
          path: ./src/web
          target: /app
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  pgdata:
