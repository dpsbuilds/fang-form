services:
  api:
    build:
      context: ./src/api
      dockerfile: Dockerfile
    ports:
      - "5223:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  web:
    build:
      context: ./src/web
      dockerfile: Dockerfile
    ports:
      - "4200:8080"
    depends_on:
      - api